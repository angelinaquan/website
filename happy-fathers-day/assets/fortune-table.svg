<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Chinese-inspired Father's Day fortune table</title>
  <desc id="desc">A warm festive tabletop with fortune slips, oranges, tea, and soft gold accents.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="43%" r="70%">
      <stop offset="0%" stop-color="#fff3ce"/>
      <stop offset="52%" stop-color="#f4c96c"/>
      <stop offset="100%" stop-color="#9f2b20"/>
    </radialGradient>
    <linearGradient id="paper" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4d7"/>
      <stop offset="100%" stop-color="#edc878"/>
    </linearGradient>
    <linearGradient id="redPaper" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#bd261e"/>
      <stop offset="100%" stop-color="#74120f"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4d0b08" flood-opacity="0.23"/>
    </filter>
    <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="18" r="1.2" fill="#fff4c4" opacity=".35"/>
      <circle cx="48" cy="8" r="1" fill="#7d150f" opacity=".15"/>
      <circle cx="63" cy="44" r="1.4" fill="#fff9df" opacity=".28"/>
      <circle cx="22" cy="67" r="1" fill="#6a130f" opacity=".12"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#grain)" opacity=".58"/>
  <path d="M0 760 C280 675 460 735 710 684 C955 634 1106 552 1600 620 L1600 1000 L0 1000 Z" fill="#7c1612" opacity=".18"/>
  <path d="M0 823 C340 760 570 836 850 780 C1108 729 1300 704 1600 762 L1600 1000 L0 1000 Z" fill="#54100e" opacity=".15"/>

  <g filter="url(#softShadow)">
