      <rect x="23" y="21" width="344" height="11" rx="5.5" fill="#f4c96c" opacity=".78"/>
      <rect x="23" y="51" width="260" height="11" rx="5.5" fill="#f4c96c" opacity=".56"/>
      <circle cx="345" cy="52" r="28" fill="#f6d57f" opacity=".88"/>
    </g>
    <g transform="translate(1130 650) rotate(13)">
      <rect x="0" y="0" width="360" height="96" rx="18" fill="url(#redPaper)"/>
      <rect x="28" y="22" width="298" height="10" rx="5" fill="#f4c96c" opacity=".76"/>
      <rect x="28" y="51" width="214" height="10" rx="5" fill="#f4c96c" opacity=".55"/>
      <circle cx="306" cy="49" r="25" fill="#f6d57f" opacity=".9"/>
    </g>
  </g>

  <g filter="url(#softShadow)">
