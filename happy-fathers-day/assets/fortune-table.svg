      <circle cx="72" cy="92" r="72" fill="#e87920"/>
      <circle cx="70" cy="89" r="55" fill="#f79b31"/>
      <path d="M57 17 C74 -10 110 -16 133 4 C105 12 83 24 66 43 Z" fill="#496b3d"/>
      <path d="M34 68 C70 52 114 58 139 87" fill="none" stroke="#ffc26b" stroke-width="8" stroke-linecap="round" opacity=".45"/>
    </g>
    <g transform="translate(1303 527)">
      <circle cx="70" cy="82" r="70" fill="#dc661c"/>
      <circle cx="68" cy="80" r="52" fill="#f1912a"/>
